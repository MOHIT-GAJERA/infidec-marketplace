<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d">
  <title id="t">Go4Foodie architecture</title>
  <desc id="d">Customer Website, Mobile App and Admin Panel call the API through a Firebase Hosting rewrite to one Cloud Function named api, which reads and writes Cloud Firestore, Cloud Storage and Firebase Authentication and calls payment gateways and SMTP. The Admin Panel also listens to Firestore in real time with read-only rules.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0B5E46"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#E8640F"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0B5E46" stroke-opacity=".06"/>
    </pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A1C18" flood-opacity=".10"/>
    </filter>
  </defs>
  <style>
    text{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0E211C}
    .h{font-size:24px;font-weight:800}
    .lead{font-size:14px;font-weight:500;fill:#55665F}
    .sec{font-size:12px;font-weight:800;letter-spacing:.14em;fill:#0B5E46}
    .bt{font-size:16px;font-weight:800}
    .bs{font-size:13px;font-weight:500;fill:#55665F}
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13.5px;font-weight:700}
    .w{fill:#FFFFFF}.wm{fill:#B9CCC4}.or{fill:#FFB98A}.gm{fill:#0B5E46}
    .lab{font-size:12px;font-weight:700;fill:#0B5E46}
    .labo{font-size:13px;font-weight:700;fill:#C9520A}
    .box{fill:#FFFFFF;stroke:#D5E2DC;stroke-width:1.2}
    .ln{stroke:#0B5E46;stroke-width:2;fill:none}
  </style>

  <rect width="1000" height="720" rx="24" fill="#F2F6F4"/>
  <rect width="1000" height="720" rx="24" fill="url(#grid)"/>

  <text x="30" y="46" class="h">Go4Foodie architecture</text>
  <text x="30" y="70" class="lead">Serverless on Firebase — one Cloud Function behind a Hosting rewrite, no server to run.</text>

  <!-- section labels -->
  <text x="30" y="108" class="sec">CLIENTS</text>
  <text x="290" y="108" class="sec">EDGE</text>
  <text x="530" y="108" class="sec">SERVERLESS API</text>
  <text x="810" y="108" class="sec">DATA</text>

  <!-- clients -->
  <g filter="url(#sh)">
    <rect x="30" y="120" width="220" height="92" rx="14" class="box"/>
    <rect x="30" y="236" width="220" height="92" rx="14" class="box"/>
    <rect x="30" y="352" width="220" height="92" rx="14" class="box"/>
  </g>
  <rect x="30" y="132" width="4" height="68" rx="2" fill="#E8640F"/>
  <rect x="30" y="248" width="4" height="68" rx="2" fill="#E8640F"/>
  <rect x="30" y="364" width="4" height="68" rx="2" fill="#E8640F"/>
  <text x="48" y="150" class="bt">Customer Website</text>
  <text x="48" y="171" class="bs">Next.js 16 · Firebase App Hosting</text>
  <text x="48" y="195" class="mono gm">/api/* → ADMIN_API_URL</text>
  <text x="48" y="266" class="bt">Mobile App</text>
  <text x="48" y="287" class="bs">Flutter · Android &amp; iOS</text>
  <text x="48" y="309" class="bs">Customer · Restaurant · Owner</text>
  <text x="48" y="382" class="bt">Admin Panel</text>
  <text x="48" y="403" class="bs">Flutter Web · Firebase Hosting</text>
  <text x="48" y="425" class="bs">20 screens · light &amp; dark</text>

  <!-- clients -> hosting -->
  <path d="M250 166 C270 166 270 246 286 246" class="ln" marker-end="url(#ar)"/>
  <path d="M250 282 L286 282" class="ln" marker-end="url(#ar)"/>
  <path d="M250 398 C270 398 270 318 286 318" class="ln" marker-end="url(#ar)"/>

  <!-- hosting -->
  <rect x="290" y="196" width="190" height="172" rx="14" class="box" filter="url(#sh)"/>
  <text x="308" y="226" class="bt">Firebase Hosting</text>
  <text x="308" y="247" class="bs">Rewrite on admin site</text>
  <text x="308" y="265" class="bs">and API host</text>
  <rect x="306" y="282" width="158" height="34" rx="8" fill="#E6F1EC"/>
  <text x="385" y="304" class="mono gm" text-anchor="middle">/api/** → api</text>
  <text x="308" y="344" class="bs">SPA fallback for admin</text>

  <!-- hosting -> function -->
  <path d="M480 282 L526 282" class="ln" marker-end="url(#ar)"/>

  <!-- function -->
  <rect x="530" y="120" width="246" height="324" rx="16" fill="#0F2621" filter="url(#sh)"/>
  <text x="548" y="152" class="bt w">Cloud Function</text>
  <rect x="676" y="136" width="44" height="22" rx="6" fill="#E8640F"/>
  <text x="698" y="152" class="mono w" text-anchor="middle">api</text>
  <text x="548" y="174" class="bs wm">Node.js 22 · Express · asia-south1</text>

  <rect x="546" y="192" width="214" height="72" rx="10" fill="#17352E" stroke="#24493F"/>
  <text x="562" y="220" class="mono or">/api/*</text>
  <text x="562" y="244" class="bs wm">Public · website</text>
  <rect x="546" y="274" width="214" height="72" rx="10" fill="#17352E" stroke="#24493F"/>
  <text x="562" y="302" class="mono or">/api/mobile/*</text>
  <text x="562" y="326" class="bs wm">JWT (HS256) · mobile app</text>
  <rect x="546" y="356" width="214" height="72" rx="10" fill="#17352E" stroke="#24493F"/>
  <text x="562" y="384" class="mono or">/api/admin/*</text>
  <text x="562" y="408" class="bs wm">Firebase ID token · admin</text>

  <!-- function -> data -->
  <path d="M776 166 L806 166" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <path d="M776 282 L806 282" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <path d="M776 398 L806 398" class="ln" marker-end="url(#ar)" marker-start="url(#ar)"/>

  <!-- data -->
  <g filter="url(#sh)">
    <rect x="810" y="120" width="160" height="92" rx="14" class="box"/>
    <rect x="810" y="236" width="160" height="92" rx="14" class="box"/>
    <rect x="810" y="352" width="160" height="92" rx="14" class="box"/>
  </g>
  <rect x="966" y="132" width="4" height="68" rx="2" fill="#2E9E57"/>
  <rect x="966" y="248" width="4" height="68" rx="2" fill="#2E9E57"/>
  <rect x="966" y="364" width="4" height="68" rx="2" fill="#2E9E57"/>
  <text x="826" y="154" class="bt">Firebase Auth</text>
  <text x="826" y="176" class="bs">Custom tokens</text>
  <text x="826" y="194" class="bs">for the admin</text>
  <text x="826" y="270" class="bt">Cloud Storage</text>
  <text x="826" y="292" class="bs">Image uploads</text>
  <text x="826" y="386" class="bt">Cloud Firestore</text>
  <text x="826" y="408" class="bs">Database</text>
  <text x="826" y="426" class="bs">asia-south1</text>

  <!-- outbound -->
  <text x="506" y="566" class="sec" text-anchor="end">OUTBOUND</text>
  <path d="M600 444 L600 522" class="ln" marker-end="url(#ar)"/>
  <path d="M740 444 L740 522" class="ln" marker-end="url(#ar)"/>
  <g filter="url(#sh)">
    <rect x="520" y="526" width="164" height="80" rx="14" class="box"/>
    <rect x="696" y="526" width="140" height="80" rx="14" class="box"/>
  </g>
  <text x="536" y="556" class="bt">Payments</text>
  <text x="536" y="578" class="bs">Razorpay · Stripe</text>
  <text x="536" y="595" class="bs">PayPal</text>
  <text x="712" y="556" class="bt">SMTP mail</text>
  <text x="712" y="578" class="bs">Branded emails</text>

  <!-- realtime listeners -->
  <path d="M140 444 L140 660 L890 660 L890 448" fill="none" stroke="#E8640F" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ao)"/>
  <rect x="300" y="646" width="400" height="28" rx="14" fill="#F2F6F4"/>
  <text x="500" y="665" class="labo" text-anchor="middle">Admin realtime listeners → Firestore (read-only rules)</text>
</svg>
