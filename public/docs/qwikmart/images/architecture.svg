<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Inter, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">QwikMart architecture</title>
  <desc id="d">Customer app, delivery app, website and admin panels all connect to one Firebase project: Authentication, Firestore, Cloud Functions, Storage and Cloud Messaging. Cloud Functions call payment gateways, SMTP, SMS and Gemini.</desc>
  <rect width="960" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <!-- clients -->
  <g font-size="14" font-weight="600" fill="#0f172a">
    <rect x="20" y="30" width="196" height="64" rx="12" fill="#E6F4E9" stroke="#0E9623"/>
    <text x="118" y="58" text-anchor="middle">Customer App</text>
    <text x="118" y="78" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Flutter · Android / iOS</text>
    <rect x="256" y="30" width="196" height="64" rx="12" fill="#E6F4E9" stroke="#0E9623"/>
    <text x="354" y="58" text-anchor="middle">Delivery Boy App</text>
    <text x="354" y="78" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Flutter · Android / iOS</text>
    <rect x="492" y="30" width="196" height="64" rx="12" fill="#eef4ff" stroke="#1556e0"/>
    <text x="590" y="58" text-anchor="middle">Web Portal</text>
    <text x="590" y="78" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Next.js · App Hosting</text>
    <rect x="728" y="30" width="212" height="64" rx="12" fill="#eef4ff" stroke="#1556e0"/>
    <text x="834" y="58" text-anchor="middle">Admin · Store · Rider panels</text>
    <text x="834" y="78" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">Next.js · App Hosting</text>
  </g>
  <g stroke="#64748b" stroke-width="1.6" marker-end="url(#a)">
    <line x1="118" y1="96" x2="118" y2="150"/><line x1="354" y1="96" x2="354" y2="150"/>
    <line x1="590" y1="96" x2="590" y2="150"/><line x1="834" y1="96" x2="834" y2="150"/>
  </g>
  <!-- firebase -->
  <rect x="20" y="152" width="920" height="186" rx="16" fill="#fff8eb" stroke="#f59e0b"/>
  <text x="40" y="180" font-size="15" font-weight="700" fill="#92400e">Your Firebase project (Blaze plan)</text>
  <g font-size="13" font-weight="600" fill="#0f172a">
    <rect x="40" y="196" width="160" height="58" rx="10" fill="#fff" stroke="#fbbf24"/>
    <text x="120" y="221" text-anchor="middle">Authentication</text>
    <text x="120" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">OTP · e-mail · guest</text>
    <rect x="216" y="196" width="160" height="58" rx="10" fill="#fff" stroke="#fbbf24"/>
    <text x="296" y="221" text-anchor="middle">Cloud Firestore</text>
    <text x="296" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">data + security rules</text>
    <rect x="392" y="196" width="176" height="58" rx="10" fill="#fff" stroke="#fbbf24"/>
    <text x="480" y="221" text-anchor="middle">Cloud Functions</text>
    <text x="480" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">orders · payments · wallet</text>
    <rect x="584" y="196" width="160" height="58" rx="10" fill="#fff" stroke="#fbbf24"/>
    <text x="664" y="221" text-anchor="middle">Cloud Storage</text>
    <text x="664" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">images · documents</text>
    <rect x="760" y="196" width="160" height="58" rx="10" fill="#fff" stroke="#fbbf24"/>
    <text x="840" y="221" text-anchor="middle">Cloud Messaging</text>
    <text x="840" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#475569">push notifications</text>
  </g>
  <text x="480" y="300" text-anchor="middle" font-size="12.5" fill="#78350f">Catalogue reads go straight to Firestore · trusted actions (prices, orders, payments, refunds) run in Cloud Functions</text>
  <line x1="480" y1="340" x2="480" y2="388" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- external -->
  <g font-size="13" font-weight="600" fill="#0f172a">
    <rect x="120" y="390" width="160" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="200" y="420" text-anchor="middle">Razorpay &amp; gateways</text>
    <rect x="300" y="390" width="160" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="380" y="420" text-anchor="middle">SMTP e-mail</text>
    <rect x="480" y="390" width="160" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="560" y="420" text-anchor="middle">SMS gateways</text>
    <rect x="660" y="390" width="160" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="740" y="420" text-anchor="middle">Google Gemini AI</text>
  </g>
</svg>
